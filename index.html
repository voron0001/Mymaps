<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мои карты">
<title>Мои карты</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#121212;--s:#1f1f1f;--s2:#2b2b2b;--t:#ececec;--m:#8c8c8c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;position:relative}
.bar h1{flex:1;margin:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:44px;height:44px;border-radius:14px;background:var(--s);display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;fill:var(--t)}
.menu{position:absolute;right:14px;top:60px;background:var(--s2);border-radius:18px;padding:6px;min-width:230px;z-index:20;box-shadow:0 10px 30px #000a}
.menu button{display:block;width:100%;text-align:left;background:none;padding:14px;border-radius:12px;font-size:17px}
.menu button:active{background:#3a3a3a}
#main{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 14px 14px;gap:10px;overflow:auto}
.wide{width:100%;padding:15px;border-radius:18px;background:var(--t);color:#111;font-weight:700;flex:none}
.wide:active{background:#bbb}
.item{display:flex;align-items:center;gap:12px;background:var(--s);border-radius:20px;padding:10px;flex:none}
.item img{width:60px;height:60px;border-radius:14px;object-fit:cover;background:#000}
.item span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--m);text-align:center;margin:30px 20px}
#sc{flex:1;min-height:0;overflow:auto;border-radius:20px;background:#000;border:2px solid var(--t);-webkit-overflow-scrolling:touch}
#wrap{position:relative;line-height:0}
#mimg{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:36px;height:36px;transform:translate(-50%,-50%);border-radius:11px;border:2px solid var(--t);background:#1a1a1a;object-fit:cover}
.zoom{position:absolute;right:26px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.zoom.noedit{bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.zoom button{width:44px;height:44px;border-radius:14px;background:var(--t);color:#111;font-size:24px;font-weight:700}
.hint{color:var(--m);font-size:14px;text-align:center;flex:none}
.tray{display:flex;gap:10px;overflow-x:auto;flex:none;padding-bottom:2px}
.chip{cursor:pointer;max-width:260px;flex:none;display:flex;align-items:center;gap:8px;background:var(--s);border:2px solid transparent;border-radius:16px;padding:8px 12px 8px 8px}
.chip img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.chip small{color:var(--m)}.chip em{display:block;font-style:normal;font-size:13px;line-height:1.3;color:var(--m);margin-top:2px}.mkpen{width:32px;height:32px;border-radius:10px;background:var(--s2);display:grid;place-items:center;flex:none}.mkpen svg{width:16px;height:16px;fill:var(--t)}
.chip.sel{border-color:var(--t);background:var(--s2)}
#ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:30}
#ov[hidden]{display:none}
.box{background:var(--s);border-radius:24px;padding:20px;width:100%;max-width:360px}
.box h3{margin:0 0 14px;font-size:19px}
.box input,.box textarea{resize:none;width:100%;padding:14px;border-radius:14px;border:2px solid #444;background:#121212;color:var(--t);font:inherit;margin-bottom:14px}
.row{display:flex;gap:10px}
.row button{flex:1;padding:14px;border-radius:14px;background:var(--t);color:#111;font-weight:700}
.row .g{background:var(--s2);color:var(--t)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t);color:#111;padding:12px 18px;border-radius:16px;font-weight:600;z-index:40;max-width:90%;text-align:center}
#toast[hidden]{display:none}
.zoom svg{width:22px;height:22px;fill:#111}
.pin.hl{width:46px;height:46px;z-index:5;border-color:#fff;box-shadow:0 0 0 4px #fff,0 0 22px 8px #fffa;animation:pl 1.2s ease-in-out infinite}
.pin.dim{opacity:.25}
@keyframes pl{50%{box-shadow:0 0 0 7px #fff6,0 0 28px 12px #fff6}}
.lst{max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.lrow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;background:var(--s2);border:2px solid transparent;cursor:pointer}
.lrow.on{border-color:var(--t)}
.lrow img{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none}
.lrow em{display:block;font-style:normal;font-size:13px;color:var(--m)}
.lrow small{color:var(--m)}
</style></head>
<body>
<div class="bar"><h1 id="title">Мои карты</h1>
<button class="ic" id="dots" aria-label="Меню"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.4" rx="1.2"/><rect x="3" y="10.8" width="18" height="2.4" rx="1.2"/><rect x="3" y="16.6" width="18" height="2.4" rx="1.2"/></svg></button>
<div class="menu" id="menu" hidden><button id="m-edit">Редактировать</button><button id="m-list">Список меток</button><button id="m-all">Все мои карты</button></div></div>
<div id="main"></div>
<div id="ov" hidden></div><div id="toast" hidden></div>
<script>
const LIST='<svg viewBox="0 0 24 24"><circle cx="4.5" cy="6" r="1.8"/><circle cx="4.5" cy="12" r="1.8"/><circle cx="4.5" cy="18" r="1.8"/><rect x="9" y="5" width="12" height="2" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="9" y="17" width="12" height="2" rx="1"/></svg>';
const PEN='<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
let S={maps:[]},cur=null,edit=false,sel=null,zoom=1,db=null,hl=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('mymaps',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{db=await idb();const v=await new Promise((res,rej)=>{const q=db.transaction('k').objectStore('k').get('s');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(v)S=v}catch(e){}}
function save(){try{if(!db)throw 0;db.transaction('k','readwrite').objectStore('k').put(S,'s')}catch(e){toast('Не удалось сохранить данные')}}
function pick(max,type){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,.88))};im.onerror=()=>{toast('Не удалось открыть изображение');res(null)};im.src=URL.createObjectURL(f)};i.click()})}
function ask(title,val,input=true,ok='Сохранить'){return new Promise(r=>{const o=$('#ov');o.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${input?`<input id="in" maxlength="40" value="${esc(val||'')}">`:''}<div class="row"><button class="g" id="no">Отмена</button><button id="ok">${ok}</button></div></div>`;o.hidden=false;const i=$('#in');if(i){i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter')$('#ok').click()}}const end=x=>{o.hidden=true;r(x)};$('#no').onclick=()=>end(null);$('#ok').onclick=()=>end(i?(i.value.trim()||null):true)})}

function askMk(title,k){return new Promise(r=>{const o=$('#ov');let icon=k.icon;o.innerHTML=`<div class="box"><h3>${esc(title)}</h3><input id="in" maxlength="40" placeholder="Название" value="${esc(k.name)}"><textarea id="ds" rows="3" maxlength="300" placeholder="Описание (необязательно)">${esc(k.desc||'')}</textarea><div class="row" style="margin-bottom:10px"><img id="pv" src="${icon}" alt="" style="width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none"><button class="g" id="ci">Сменить картинку</button></div><div class="row"><button class="g" id="no">Отмена</button><button id="ok">Сохранить</button></div></div>`;o.hidden=false;$('#ci').onclick=async()=>{const n=await pick(96,'image/png');if(n){icon=n;$('#pv').src=n}};const end=x=>{o.hidden=true;r(x)};$('#no').onclick=()=>end(null);$('#ok').onclick=()=>{const n=$('#in').value.trim();if(!n)return toast('Введите название');end({name:n,desc:$('#ds').value.trim(),icon})}})}
function showList(){if(!cur)return toast('Сначала откройте карту');if(!cur.markers.length)return toast('Меток пока нет');
const o=$('#ov');o.innerHTML=`<div class="box"><h3>Метки на карте</h3><div class="lst">${cur.markers.map(k=>`<div class="lrow${k.id===hl?' on':''}" data-hl="${k.id}"><img src="${k.icon}" alt=""><div><b>${esc(k.name)}</b> <small>${k.pins.length}</small>${k.desc?`<em>${esc(k.desc)}</em>`:''}</div></div>`).join('')}</div><div class="row"><button class="g" id="cl">Закрыть</button>${hl?'<button id="rs">Сбросить</button>':''}</div></div>`;o.hidden=false;
$('#cl').onclick=()=>o.hidden=true;if(hl)$('#rs').onclick=()=>{hl=null;o.hidden=true;view()};
o.querySelectorAll('[data-hl]').forEach(r=>r.onclick=()=>{const k=cur.markers.find(x=>x.id===r.dataset.hl);hl=hl===k.id?null:k.id;o.hidden=true;view();if(hl){if(!k.pins.length)return toast('«'+k.name+'» ещё не стоит на карте');focusK(k)}})}
function focusK(k){const sc=$('#sc'),w=$('#wrap'),p=k.pins[0];sc.scrollTo({left:p.x/100*w.offsetWidth-sc.clientWidth/2,top:p.y/100*w.offsetHeight-sc.clientHeight/2,behavior:'smooth'})}
function home(){cur=null;hl=null;edit=false;sel=null;$('#title').textContent='Мои карты';
$('#main').innerHTML=`<button class="wide" id="addmap">Добавить карту</button>`+(S.maps.length?S.maps.map(m=>`<div class="item" data-id="${m.id}"><img src="${m.img}" alt=""><span>${esc(m.name)}</span><button class="ic" data-ed="${m.id}" aria-label="Изменить название">${PEN}</button></div>`).join(''):`<p class="empty">Карт пока нет. Нажмите «Добавить карту» и загрузите скриншот карты из игры.</p>`)}

function view(){const m=cur;if(!m)return home();const old=$('#sc');const sl=old?old.scrollLeft:0,st=old?old.scrollTop:0;
$('#title').textContent=m.name;
const pins=m.markers.map(k=>k.pins.map((p,i)=>`<img class="pin${hl===k.id?' hl':hl?' dim':''}" src="${k.icon}" style="left:${p.x}%;top:${p.y}%" data-k="${k.id}" data-i="${i}" alt="${esc(k.name)}">`).join('')).join('');
const cur_k=m.markers.find(k=>k.id===sel);
$('#main').innerHTML=(edit?`<button class="wide" id="addmk">Добавить метку</button>`:'')+`<div id="sc"><div id="wrap" style="width:${zoom*100}%"><img id="mimg" src="${m.img}" alt="">${pins}</div></div>`+
(edit?`<div class="hint">${cur_k?`Нажмите на карту, чтобы поставить «${esc(cur_k.name)}». Нажмите на метку, чтобы убрать её.`:'Выберите метку внизу, чтобы расставлять её на карте.'}</div><div class="tray">${m.markers.map(k=>`<div class="chip${k.id===sel?' sel':''}" data-chip="${k.id}"><img src="${k.icon}" alt=""><span>${esc(k.name)} <small>${k.pins.length}</small>${k.desc?`<em>${esc(k.desc)}</em>`:''}</span><b class="mkpen" data-mk="${k.id}" aria-label="Изменить метку">${PEN}</b></div>`).join('')}</div>`:'')+
`<div class="zoom${edit?'':' noedit'}"><button id="lst" aria-label="Список меток">${LIST}</button><button id="zi" aria-label="Приблизить">+</button><button id="zo" aria-label="Отдалить">−</button></div>`;
const sc=$('#sc');sc.scrollLeft=sl;sc.scrollTop=st}

async function addMap(){const img=await pick(2000,'image/jpeg');if(!img)return;const name=await ask('Название карты','Новая карта');if(!name)return;
const m={id:uid(),name,img,markers:[]};S.maps.unshift(m);save();cur=m;edit=false;zoom=1;view();toast('Карта загружена. Нажмите ≡ → Редактировать, чтобы добавить метки')}
async function addMarker(){const icon=await pick(96,'image/png');if(!icon)return;const r=await askMk('Новая метка',{name:'',desc:'',icon});if(!r)return;
const k={id:uid(),...r,pins:[]};cur.markers.push(k);sel=k.id;save();view();toast('Нажмите на карту, чтобы поставить метку')}

$('#dots').onclick=e=>{e.stopPropagation();const m=$('#menu');m.hidden=!m.hidden;$('#m-edit').textContent=edit?'Завершить редактирование':'Редактировать'};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').hidden=true});
$('#m-list').onclick=()=>{$('#menu').hidden=true;showList()};
$('#m-all').onclick=()=>{$('#menu').hidden=true;home()};
$('#m-edit').onclick=()=>{$('#menu').hidden=true;if(!cur)return toast('Сначала откройте карту');
if(edit){edit=false;sel=null;return view()}
edit=true;sel=null;view();if(!cur.markers.length)addMarker()};

$('#main').addEventListener('click',async e=>{const t=e.target;
if(t.closest('#addmap'))return addMap();
const ed=t.closest('[data-ed]');if(ed){const m=S.maps.find(x=>x.id===ed.dataset.ed);const n=await ask('Название карты',m.name);if(n){m.name=n;save();home()}return}
const it=t.closest('.item');if(it){cur=S.maps.find(x=>x.id===it.dataset.id);hl=null;edit=false;sel=null;zoom=1;return view()}
if(t.closest('#addmk'))return addMarker();
const mp=t.closest('[data-mk]');if(mp){const k=cur.markers.find(x=>x.id===mp.dataset.mk);const r=await askMk('Изменить метку',k);if(r){Object.assign(k,r);save();view()}return}
const ch=t.closest('[data-chip]');if(ch){sel=sel===ch.dataset.chip?null:ch.dataset.chip;return view()}
if(t.closest('#lst'))return showList();
if(t.id==='zi'){zoom=Math.min(5,zoom+.5);return view()}
if(t.id==='zo'){zoom=Math.max(1,zoom-.5);return view()}
const pin=t.closest('.pin');
if(pin){const k=cur.markers.find(x=>x.id===pin.dataset.k);if(!edit)return toast(k.desc?k.name+': '+k.desc:k.name);
if(await ask('Убрать метку «'+k.name+'» с карты?','',false,'Убрать')){k.pins.splice(+pin.dataset.i,1);save();view()}return}
if(!edit&&t.id==='mimg'&&hl){hl=null;return view()}
if(edit&&t.id==='mimg'){const k=cur.markers.find(x=>x.id===sel);if(!k)return toast('Сначала выберите метку внизу');
const r=$('#wrap').getBoundingClientRect();k.pins.push({x:+((e.clientX-r.left)/r.width*100).toFixed(2),y:+((e.clientY-r.top)/r.height*100).toFixed(2)});save();view()}});

load().then(home);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
